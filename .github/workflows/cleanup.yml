name: Limpieza de Cuenta (Manual)

on:
  workflow_dispatch: # Solo ejecutable manualmente por seguridad
    inputs:
      action:
        description: 'Acción a realizar'
        required: true
        default: 'stats'
        type: choice
        options:
          - stats
          - cleanup-tweets
          - cleanup-follows
          - full-cleanup

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📦 Instalar dependencias
        run: npm ci
        
      - name: 🏗️ Compilar TypeScript
        run: npm run build
        
      - name: 🧹 Ejecutar limpieza
        run: npm run cleanup
        env:
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          
      - name: 📊 Subir logs de limpieza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs
          path: logs/
          retention-days: 30
